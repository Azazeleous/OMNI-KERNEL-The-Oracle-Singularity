function frame(ms){const c=sky.c,gl=sky.ctx;if(!c||!gl)return;const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,1.6),W=Math.ceil(w*dpr),H=Math.ceil(h*dpr);if(c.width!==W||c.height!==H){c.width=W;c.height=H}const n=sky.nodes.length;const pts=[];for(let i=0;i<n;i++){const angle=i*2.3999632;const y=1-2*(i+.5)/Math.max(1,n),r=Math.sqrt(Math.max(0,1-y*y));pts.push([Math.cos(angle)*r*.75,y*.75,Math.sin(angle)*r*.75])}const a=ms/1000;if(sky.active==='WEBGL2'){gl.viewport(0,0,W,H);gl.clearColor(.007,.014,.03,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.useProgram(sky.program);gl.uniform1f(gl.getUniformLocation(sky.program,'t'),a);gl.uniform1f(gl.getUniformLocation(sky.program,'aspect'),w/h);gl.bindBuffer(gl.ARRAY_BUFFER,sky.buffer);const attr=gl.getAttribLocation(sky.program,'p');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,3,gl.FLOAT,false,0,0);const edges=[];for(let i=1;i<pts.length;i++){edges.push(...pts[0],...pts[i]);if(i>1)edges.push(...pts[i-1],...pts[i])}gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(edges),gl.DYNAMIC_DRAW);gl.uniform1f(gl.getUniformLocation(sky.program,'pointMode'),0);gl.drawArrays(gl.LINES,0,edges.length/3);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pts.flat()),gl.DYNAMIC_DRAW);gl.uniform1f(gl.getUniformLocation(sky.program,'pointMode'),1);gl.drawArrays(gl.POINTS,0,n)}else{const ctx=gl;ctx.clearRect(0,0,W,H);ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#00e5ff39';ctx.fillStyle='#4df4ff';const coords=pts.map(([x,y,z])=>{const ca=Math.cos(a*.1),sa=Math.sin(a*.1);return [(x*ca-z*sa)*W*.38+W/2,y*H*.38+H/2]});coords.forEach(([x,y],i)=>{if(i){ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(x,y);ctx.stroke()}ctx.beginPath();ctx.arc(x,y,Math.max(2,dpr*3),0,Math.PI*2);ctx.fill()})}requestAnimationFrame(frame)}
class Terminal extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'});this.history=[];this.historyAt=0;this.busy=false}connectedCallback(){this.shadowRoot.innerHTML=`<style>:host{display:flex;min-height:0;font:12px ui-monospace,Consolas,monospace;color:#cde9f7}*{box-sizing:border-box}.wrap{display:flex;flex:1;flex-direction:column;min-width:0}.bar{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#030917dd;border-bottom:1px solid #17384e}.dots{display:flex;gap:5px}.dots i{display:block;width:9px;height:9px;border-radius:50%;background:#f87171}.dots i:nth-child(2){background:#ffcc00}.dots i:nth-child(3){background:#34d399}h1{font-size:12px;color:#bef8ff;margin:0;letter-spacing:.08em;flex:1}.ver{font-size:9px;color:#769caa}.log{flex:1;min-height:0;overflow-y:auto;padding:18px 18px 6px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;scrollbar-color:#24576e transparent}.line{margin:0 0 11px}.cmd{color:#ffcc00}.ok{color:#34d399}.err{color:#f87171}.muted{color:#94a3b8}.form{display:flex;align-items:center;gap:9px;padding:14px 15px;background:#020812ef;border-top:1px solid #1b3b51}.prompt{color:#34d399;font-weight:700;white-space:nowrap}.input{background:transparent;border:0;color:#fff;font:inherit;width:100%;outline:0;min-width:0}.go{border:1px solid #00e5ff55;border-radius:5px;background:#072635;color:#9eedff;padding:8px 11px;cursor:pointer}.go:hover{background:#10445c}.hot{display:flex;gap:7px;flex-wrap:wrap;padding:7px 15px;border-top:1px solid #122b3d}.hot button{border:1px solid #143849;border-radius:5px;background:#081725;color:#82a7be;font:10px ui-monospace,monospace;padding:6px 9px;cursor:pointer}.hot button:hover{color:#fff;border-color:#00e5ff}@media(max-width:480px){.log{padding:12px}.bar{padding:10px}.hot{padding:6px}.form{padding:10px}.ver{display:none}}</style><div class="wrap"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><h1>⌁ SOVEREIGN HYPERTERMINAL</h1><span class="ver">LOCAL VFS · ADAM LEDGER</span></div><div class="log" role="log" aria-live="polite"></div><div class="hot"><button data-c="help">HELP</button><button data-c="status">STATUS</button><button data-c="nodes">NODES</button><button data-c="verify">ADAM VERIFY</button><button data-c="quine">EXPORT QUINE</button></div><form class="form"><span class="prompt">gaia:~$</span><input class="input" spellcheck="false" autocomplete="off" aria-label="Terminal command" placeholder="help • ls • write • quine • bridge"><button class="go" type="submit">RUN ↵</button></form></div>`;const root=this.shadowRoot;this.log=root.querySelector('.log');this.input=root.querySelector('input');root.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();await this.run(this.input.value)});root.querySelectorAll('[data-c]').forEach(btn=>btn.addEventListener('click',()=>this.run(btn.dataset.c)));this.input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();this.historyAt=Math.max(0,this.historyAt-1);this.input.value=this.history[this.historyAt]||''}if(e.key==='ArrowDown'){e.preventDefault();this.historyAt=Math.min(this.history.length,this.historyAt+1);this.input.value=this.history[this.historyAt]||''}});this.print('GAIA HYPERTERMINAL v'+VERSION+' — AZAZELEOUS','ok');this.print('Real browser-local workspace online. Native host commands are not exposed on public Pages.','muted');this.print('Type help to inspect available commands.','muted')}

async execute(raw){const [command,...args]=tokenize(raw),cmd=command?.toLowerCase();const dest=pathResolve(state.cwd,args[0]),file=state.files[dest],has=Object.prototype.hasOwnProperty.call(state.files,dest);switch(cmd){case 'help':this.print('help | status | capabilities | whoami | pwd | ls [path] | cd <dir> | cat <file> | mkdir <dir> | write <file> <text> | sha <file> | ledger [last N] | verify | selftest | nodes | clear | export | import | quine | connect <localhost URL> | bridge | disconnect');return;case 'status':this.print(JSON.stringify(summary(),null,2));return;case 'capabilities':this.print(JSON.stringify({webgl2:sky.active==='WEBGL2',webcrypto:!!crypto?.subtle,storage:state.persisted?'AVAILABLE':'EPHEMERAL',speechSynthesis:'speechSynthesis'in window,localBridge:state.bridge?'CONFIGURED_NOT_AUTHENTICATED':'DISCONNECTED',nativeShell:'NOT_AVAILABLE_IN_BROWSER'},null,2));return;case 'whoami':this.print('VISITOR • Azazeleous hosted UI • device scope: this browser only');return;case 'pwd':this.print(state.cwd);return;case 'ls':{const p=pathResolve(state.cwd,args[0]||'.');if(!state.dirs.has(p))throw Error('Not a directory: '+p);const items=[...state.dirs,...Object.keys(state.files)].filter(x=>x!==p&&x.startsWith(p==='/'?'/':p+'/')&&!x.slice((p==='/'?'':p).length+1).includes('/'));this.print(items.length?items.sort().join('\n'):'(empty)');return}case 'cd':if(!state.dirs.has(dest))throw Error('Directory missing: '+dest);state.cwd=dest;this.print(dest,'ok');return;case 'cat':if(!has)throw Error('File missing: '+dest);this.print(file);return;case 'mkdir':if(!args[0])throw Error('Usage: mkdir <path>');if(!crypto?.subtle)throw Error('Secure context needed for ledger hashing');state.dirs.add(dest);save();await record('VFS_MKDIR',dest);this.print('CREATED '+dest,'ok');return;case 'write':{if(args.length<2)throw Error('Usage: write <path> <text>');if(!crypto?.subtle)throw Error('Secure context needed for ledger hashing');const parent=dest.slice(0,dest.lastIndexOf('/'))||' r};state.files=obj.files;state.dirs=new Set(obj.dirs||['/']);state.ledger=obj.ledger;const verdict=await checkLedger();if(!verdict.ok){Object.assign(state,old);throw Error('Ledger hash-chain invalid')}save();refresh();this.print('IMPORTED '+Object.keys(state.files).length+' files; chain verified.','ok')}catch(e){this.print('IMPORT FAILED: '+e.message,'err')}};pick.click();this.print('Select a GAIA workspace JSON file; the hash-chain will be checked.');return}case 'quine':{const old=$('#quine-seed').textContent;const data=JSON.stringify({version:VERSION,files:state.files,dirs:[...state.dirs],ledger:state.ledger}).replace(/</g,'\\u003c');$('#quine-seed').textContent=data;const html='<!doctype html>\n'+document.documentElement.outerHTML;$('#quine-seed').textContent=old;outFile('GAIA-HYPERTERMINAL-QUINE-v'+VERSION+'.html',html,'text/html');this.print('Standalone descendant HTML exported with workspace and ledger state.','ok');return}case 'connect':{if(!args[0])throw Error('Usage: connect http://127.0.0.1:PORT (explicit local service only)');const url=new URL(args[0]);if(!['http:','https:'].includes(url.protocol)||!['localhost','127.0.0.1','[::1]'].includes(url.hostname))throw Error('Only loopback hosts are accepted. External URLs denied.');state.bridge=url.origin;refresh();this.print('Configured local bridge '+url.origin+'. Use bridge to perform a health request. No command execution enabled.','ok');return}case 'bridge':{if(!state.bridge)throw Error('Not configured. Use connect http://127.0.0.1:PORT');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),4000);try{const r=await fetch(state.bridge+'/health',{signal:controller.signal,credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();this.print('LIVE BRIDGE RESPONSE '+r.status+'\n'+text.slice(0,700),'ok')}catch(e){this.print('BRIDGE UNAVAILABLE: '+e.message+'. The local service must explicitly allow this origin via CORS.','err')}finally{clearTime
