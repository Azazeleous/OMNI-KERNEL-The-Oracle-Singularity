name: Public security boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch immutable event commit without third-party actions
        env:
          AUDIT_REPO: ${{ github.repository }}
          AUDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$AUDIT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$AUDIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$AUDIT_REPO.git"
          git fetch --depth=1 origin "$AUDIT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Credential, provenance and boundary checks
        run: |
          python3 scripts/security_scan_v1.py
          python3 scripts/verify_import_v1.py
          node scripts/test_public_boundary_v1.cjs
